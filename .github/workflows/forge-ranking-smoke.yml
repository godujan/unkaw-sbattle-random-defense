name: Forge leaderboard API smoke test
on:
  push:
    branches: [main]
    paths:
      - "sword-forge/index.html"
      - ".github/workflows/forge-ranking-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check both public ranking categories
        run: |
          set -euo pipefail
          for kind in sword round; do
            curl --fail --show-error --silent --retry 3 --retry-delay 3 \
              -H "Origin: https://godujan.github.io" \
              "https://hepxnxnomahmnvtiqfxf.supabase.co/functions/v1/forge-ranking?category=$kind" \
              | jq -e '.rows | type == "array"'
          done
      - name: Reject invalid score submissions
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/invalid-ranking.json -w "%{http_code}" \
            -X POST -H "Origin: https://godujan.github.io" \
            -H "Content-Type: application/json" \
            --data '{"deviceId":"invalid","nickname":"bad","bestValue":120,"bestSwordName":"dagger","bestSwordLevel":0,"bestRound":1}' \
            "https://hepxnxnomahmnvtiqfxf.supabase.co/functions/v1/forge-ranking")"
          test "$code" = "400"
